name: Instagram Carousel Auto-poster

on:
  schedule:
    # Generate batch at 05:00 MSK (02:00 UTC)
    - cron: '0 2 * * *'
    # Publish checks every 15 minutes from 08:00 to 22:00 MSK (05:00-19:00 UTC)
    - cron: '*/15 5-19 * * *'
  workflow_dispatch:
    inputs:
      phase:
        description: 'Phase to run'
        required: true
        default: 'publish_next'
        type: choice
        options:
          - generate
          - publish_next
          - full

env:
  TEXT_PROVIDER: 'gemini'
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  IG_PUBLISH_METHOD: 'instagrapi'
  INSTAGRAPI_USERNAME: ${{ secrets.INSTAGRAPI_USERNAME }}
  INSTAGRAPI_PASSWORD: ${{ secrets.INSTAGRAPI_PASSWORD }}
  POSTS_PER_DAY: '20'
  PUBLISH_START_HOUR: '8'
  PUBLISH_END_HOUR: '22'
  TIMEZONE: 'Europe/Moscow'

jobs:
  # ── Generate posts for the day (05:00 MSK) ─────────────────────────────
  generate:
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '0 2 * * *')
      || (github.event_name == 'workflow_dispatch' && (github.event.inputs.phase == 'generate' || github.event.inputs.phase == 'full'))
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate carousels
        run: python main.py generate

      - name: Commit generated posts
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add pending_posts.json ideas.json
          git diff --staged --quiet || git commit -m "Auto-generate carousels $(date +%Y-%m-%d)"
          git push

  # ── Publish due posts (every 15 min) ───────────────────────────────────
  publish:
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '*/15 5-19 * * *')
      || (github.event_name == 'workflow_dispatch' && (github.event.inputs.phase == 'publish_next' || github.event.inputs.phase == 'full'))
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore Instagram session
        run: |
          echo '${{ secrets.IG_SESSION }}' > ig_session_${{ secrets.INSTAGRAPI_USERNAME }}.json

      - name: Install fonts
        run: |
          mkdir -p ~/.fonts
          cp fonts/*.ttf ~/.fonts/
          fc-cache -f -v

      - name: Publish next due post
        run: python main.py publish_next

      - name: Save updated session
        if: always()
        run: |
          if [ -f ig_session_${{ secrets.INSTAGRAPI_USERNAME }}.json ]; then
            echo "Session file exists, remember to update IG_SESSION secret if login was refreshed"
          fi

      - name: Commit changes
        if: always()
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add pending_posts.json history.json
          git diff --staged --quiet || git commit -m "Auto-publish $(date +%Y-%m-%d_%H:%M)"
          git push
