name: Instagram Carousel Auto-poster

on:
  schedule:
    # Generate batch at 05:17 MSK (02:17 UTC) — off-peak minute to avoid GH Actions cron skips
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      action:
        description: 'Что сделать'
        required: true
        default: 'generate'
        type: choice
        options:
          - generate

env:
  TEXT_PROVIDER: 'gemini'
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  POSTS_PER_DAY: '20'
  PUBLISH_START_HOUR: '8'
  PUBLISH_END_HOUR: '22'
  TIMEZONE: 'Europe/Moscow'

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install fonts
        run: |
          mkdir -p ~/.fonts
          cp fonts/*.ttf ~/.fonts/
          fc-cache -f -v

      - name: Generate carousels
        run: python main.py generate

      - name: Commit changes
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add pending_posts.json ideas.json history.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Auto: generate $(date +%Y-%m-%d_%H:%M)"
          # Retry push up to 3 times with rebase in case of concurrent pushes
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin main && break
            echo "Push attempt $i failed, retrying..."
            sleep 5
            if [ $i -eq 3 ]; then
              echo "ERROR: Push failed after 3 attempts"
              exit 1
            fi
          done
