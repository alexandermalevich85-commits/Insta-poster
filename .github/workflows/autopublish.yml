name: Instagram Carousel Auto-poster

on:
  schedule:
    # Generate batch at 05:00 MSK (02:00 UTC)
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      action:
        description: 'Что сделать'
        required: true
        default: 'generate'
        type: choice
        options:
          - generate

env:
  TEXT_PROVIDER: 'gemini'
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  POSTS_PER_DAY: '20'
  PUBLISH_START_HOUR: '8'
  PUBLISH_END_HOUR: '22'
  TIMEZONE: 'Europe/Moscow'

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install fonts
        run: |
          mkdir -p ~/.fonts
          cp fonts/*.ttf ~/.fonts/
          fc-cache -f -v

      - name: Generate carousels
        run: python main.py generate

      - name: Commit changes
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git pull --rebase origin main || true
          git add pending_posts.json ideas.json history.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Auto: generate $(date +%Y-%m-%d_%H:%M)"
          git push origin main || echo "Push failed"
