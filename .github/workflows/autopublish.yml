name: Instagram Carousel Auto-poster

on:
  schedule:
    # Generate batch at 05:00 MSK (02:00 UTC)
    - cron: '0 2 * * *'
    # Publish checks every 30 minutes from 08:00 to 22:00 MSK (05:00-19:00 UTC)
    - cron: '*/30 5-19 * * *'
  workflow_dispatch:
    inputs:
      phase:
        description: 'Phase to run'
        required: true
        default: 'publish_next'
        type: choice
        options:
          - generate
          - publish_next
          - publish
          - schedule
          - generate_and_schedule
          - full
          - render_test

env:
  TEXT_PROVIDER: ${{ vars.TEXT_PROVIDER || 'gemini' }}
  TEXT_MODEL: ${{ vars.TEXT_MODEL || '' }}
  CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
  IG_USER_ID: ${{ secrets.IG_USER_ID }}
  IG_PUBLISH_METHOD: ${{ vars.IG_PUBLISH_METHOD || 'graph_api' }}
  IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
  INSTAGRAPI_USERNAME: ${{ secrets.INSTAGRAPI_USERNAME }}
  INSTAGRAPI_PASSWORD: ${{ secrets.INSTAGRAPI_PASSWORD }}
  POSTS_PER_DAY: ${{ vars.POSTS_PER_DAY || '20' }}
  PUBLISH_START_HOUR: ${{ vars.PUBLISH_START_HOUR || '8' }}
  PUBLISH_END_HOUR: ${{ vars.PUBLISH_END_HOUR || '22' }}
  TIMEZONE: 'Europe/Moscow'

jobs:
  # ── Phase 1: Generate batch of carousels ─────────────────────────────────
  generate:
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '0 2 * * *')
      || (github.event_name == 'workflow_dispatch' && (github.event.inputs.phase == 'generate' || github.event.inputs.phase == 'full'))
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install fonts
        run: |
          mkdir -p ~/.fonts
          cp fonts/*.ttf ~/.fonts/
          fc-cache -f -v

      - name: Generate carousels
        run: python main.py generate

      - name: Commit changes
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add pending_posts.json ideas.json
          git diff --staged --quiet || git commit -m "Auto-generate carousels $(date +%Y-%m-%d)"
          git push

  # ── Phase 2: Publish next due carousel ───────────────────────────────────
  publish:
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '*/30 5-19 * * *')
      || (github.event_name == 'workflow_dispatch' && (github.event.inputs.phase == 'publish_next' || github.event.inputs.phase == 'publish' || github.event.inputs.phase == 'full'))
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install fonts
        run: |
          mkdir -p ~/.fonts
          cp fonts/*.ttf ~/.fonts/
          fc-cache -f -v

      - name: Determine command
        id: cmd
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "command=${{ github.event.inputs.phase }}" >> $GITHUB_OUTPUT
          else
            echo "command=publish_next" >> $GITHUB_OUTPUT
          fi

      - name: Publish
        run: python main.py ${{ steps.cmd.outputs.command }}

      - name: Commit changes
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add pending_posts.json history.json
          git diff --staged --quiet || git commit -m "Auto-publish carousel $(date +%Y-%m-%d_%H:%M)"
          git push
