name: Instagram Auto-Publisher

on:
  schedule:
    # Run every hour at :05 (MSK = UTC+3, so 8:05–22:05 MSK = 05:05–19:05 UTC)
    - cron: '5 5-19 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Опубликовать даже если не пришло время'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

env:
  TIMEZONE: 'Europe/Moscow'
  PUBLISH_START_HOUR: '8'
  PUBLISH_END_HOUR: '22'
  IG_PUBLISH_METHOD: 'graph_api'
  TEXT_PROVIDER: 'gemini'
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
  IG_USER_ID: ${{ secrets.IG_USER_ID }}
  IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
  GH_PAT: ${{ secrets.GH_PAT }}
  GITHUB_REPO: 'alexandermalevich85-commits/Insta-poster'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install fonts
        run: |
          mkdir -p ~/.fonts
          cp fonts/*.ttf ~/.fonts/
          fc-cache -f -v

      - name: Check and publish due posts
        run: python main.py publish

      - name: Commit updated statuses
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          # Stage only data files we care about — ignore tmp/ rendered slides
          git add pending_posts.json history.json 2>/dev/null || true
          git stash --include-untracked --quiet 2>/dev/null || true
          git pull --rebase origin main || true
          git stash pop --quiet 2>/dev/null || true
          git add pending_posts.json history.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Auto: publish $(date +%Y-%m-%d_%H:%M)"
          git push origin main || echo "Push failed"
