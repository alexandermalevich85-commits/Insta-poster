name: Instagram Auto-Publisher

on:
  schedule:
    # Run once a day at 08:30 MSK (05:30 UTC) — after morning generation.
    # Publishes 1 post immediately + schedules the rest of today's posts via
    # Instagram Graph API publish_at. IG auto-publishes scheduled ones.
    - cron: '30 5 * * *'
  workflow_dispatch:

env:
  TIMEZONE: 'Europe/Moscow'
  PUBLISH_START_HOUR: '8'
  PUBLISH_END_HOUR: '22'
  IG_PUBLISH_METHOD: 'graph_api'
  TEXT_PROVIDER: 'gemini'
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
  IG_USER_ID: ${{ secrets.IG_USER_ID }}
  GH_PAT: ${{ secrets.GH_PAT }}
  GITHUB_REPO: 'alexandermalevich85-commits/Insta-poster'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install fonts
        run: |
          mkdir -p ~/.fonts
          cp fonts/*.ttf ~/.fonts/
          fc-cache -f -v

      - name: Publish 1 + schedule rest of today
        run: python main.py publish_smart

      - name: Commit updated statuses
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add pending_posts.json history.json 2>/dev/null || true
          git stash --include-untracked --quiet 2>/dev/null || true
          git pull --rebase origin main || true
          git stash pop --quiet 2>/dev/null || true
          git add pending_posts.json history.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Auto: publish_smart $(date +%Y-%m-%d_%H:%M)"
          git push origin main || echo "Push failed"
