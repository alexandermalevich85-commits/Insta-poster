name: Instagram Auto-Publisher

on:
  schedule:
    # Every 15 min in publishing window (8:00–22:00 MSK = 5:00–19:00 UTC).
    # Off-peak minutes (5,20,35,50) — GitHub Actions cron is delayed
    # at the start of every hour, so we deliberately avoid :00/:30.
    # Each tick: directly publishes any pending post whose slot has arrived.
    # No reliance on Instagram `publish_at` (it silently fails ~10% of the time).
    - cron: '5,20,35,50 5-19 * * *'
  workflow_dispatch:

# Prevent two ticks from publishing the same post if a previous run is still
# rendering. Queue, don't cancel — we want every tick to eventually run.
concurrency:
  group: instagram-publish
  cancel-in-progress: false

env:
  TIMEZONE: 'Europe/Moscow'
  PUBLISH_START_HOUR: '8'
  PUBLISH_END_HOUR: '22'
  IG_PUBLISH_METHOD: 'graph_api'
  TEXT_PROVIDER: 'gemini'
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
  IG_USER_ID: ${{ secrets.IG_USER_ID }}
  GH_PAT: ${{ secrets.GH_PAT }}
  GITHUB_REPO: 'alexandermalevich85-commits/Insta-poster'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install fonts
        run: |
          mkdir -p ~/.fonts
          cp fonts/*.ttf ~/.fonts/
          fc-cache -f -v

      - name: Rescue any legacy scheduled containers
        run: python main.py watchdog

      - name: Publish posts whose slot has arrived
        run: python main.py publish

      - name: Commit updated statuses
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add pending_posts.json history.json 2>/dev/null || true
          git stash --include-untracked --quiet 2>/dev/null || true
          git pull --rebase origin main || true
          if ! git stash pop --quiet 2>/dev/null; then
            # Conflict on pop — semantically merge the JSON files instead
            # of leaving conflict markers in the working tree.
            python scripts/safe_merge.py || { echo "safe_merge failed"; exit 1; }
            git stash drop --quiet 2>/dev/null || true
          fi
          # Hard fail if any conflict markers slipped through — never
          # commit a corrupted JSON file again.
          if grep -lE '^(<<<<<<< |=======$|>>>>>>> )' pending_posts.json history.json 2>/dev/null; then
            echo "ERROR: conflict markers present after merge; aborting commit"
            exit 1
          fi
          git add pending_posts.json history.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Auto: publish $(date +%Y-%m-%d_%H:%M)"
          # Retry push up to 3 times with rebase in case of concurrent pushes
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin main && break
            echo "Push attempt $i failed, retrying..."
            sleep 5
            if [ $i -eq 3 ]; then
              echo "ERROR: Push failed after 3 attempts"
              exit 1
            fi
          done
